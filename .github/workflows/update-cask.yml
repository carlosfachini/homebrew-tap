name: Update CoffeeBar Cask

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-coffeebar-cask
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read latest CoffeeBar release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh api repos/carlosfachini/coffeebar/releases/latest)
          TAG=$(jq -r '.tag_name' <<< "$RELEASE")
          VERSION=${TAG#v}
          ASSET_NAME="CoffeeBar-macos-universal-$VERSION.zip"
          ASSET=$(jq -c --arg name "$ASSET_NAME" '.assets[] | select(.name == $name)' <<< "$RELEASE")

          if [[ -z "$ASSET" ]]; then
            echo "Release $TAG does not contain $ASSET_NAME"
            exit 1
          fi

          DIGEST=$(jq -r '.digest // empty' <<< "$ASSET")
          if [[ "$DIGEST" == sha256:* ]]; then
            SHA256=${DIGEST#sha256:}
          else
            DOWNLOAD_URL=$(jq -r '.browser_download_url' <<< "$ASSET")
            curl --fail --location --silent --show-error "$DOWNLOAD_URL" --output "$RUNNER_TEMP/$ASSET_NAME"
            SHA256=$(sha256sum "$RUNNER_TEMP/$ASSET_NAME" | awk '{print $1}')
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid release metadata: version=$VERSION sha256=$SHA256"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update Cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          ruby -pi -e 'gsub(/^  version ".*"$/, "  version \"#{ENV.fetch("VERSION")}\"")' Casks/coffeebar.rb
          ruby -pi -e 'gsub(/^  sha256 ".*"$/, "  sha256 \"#{ENV.fetch("SHA256")}\"")' Casks/coffeebar.rb
          ruby -c Casks/coffeebar.rb

      - name: Commit update
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Casks/coffeebar.rb; then
            echo "Cask is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/coffeebar.rb
          git commit -m "Update CoffeeBar to $VERSION"
          git push
